name: Deploy production

on:
  push:
    tags:
      - "v*"

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Fetch latest code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build pages
        run: |
          pip3 install poetry
          poetry run poetry install --no-root
          poetry run mkdocs build
          cp package.json site/package.json
      - name: Setup Vercel environment
        uses: actions/checkout@v4
        with:
          repository: darwinia-network/devops
          path: .github
      - name: Deploy to Vercel
        id: vercel
        uses: ./.github/actions/smart-vercel
        with:
          vercel_token: ${{ secrets.VERCEL_TOKEN }}
          vercel_group: itering
          preview_output: true
          project_name: msgport-docs
          prod_mode: true
          dist_path: site
          script_run: false
          vercel_json_path: docs/vercel.json
          enable_cache: true

      - name: Notify Slack
        uses: rtCamp/action-slack-notify@v2
        continue-on-error: true
        env:
          SLACK_CHANNEL: darwinia-docs
          SLACK_COLOR: ${{ job.status }}
          SLACK_ICON: https://avatars.githubusercontent.com/u/14985020?s=48&v=4
          SLACK_MESSAGE: ${{ steps.vercel.outputs.PREVIEW_LINK }}
          SLACK_TITLE: Preview
          SLACK_USERNAME: Vercel
          SLACK_WEBHOOK: ${{ secrets.SLACK_INCOMING_WEBHOOK_URL }}
